name: CI Gate (G6)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Detect project bootstrap status
        id: mode
        run: |
          if grep -Eq '^PROJECT_BOOTSTRAPPED[[:space:]]*:=[[:space:]]*true' project.mk; then
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      # 新项目搭建骨架并开启 PROJECT_BOOTSTRAPPED := true 时，
      # 在此处取消注释或替换为项目所需的运行时（Node/pnpm、Python、Go 等）：
      # ------------------------------------------------------------------
      # - name: Setup pnpm
      #   if: steps.mode.outputs.bootstrapped == 'true'
      #   uses: pnpm/action-setup@v4
      #   with:
      #     version: 9
      #
      # - name: Setup Node.js
      #   if: steps.mode.outputs.bootstrapped == 'true'
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: pnpm
      #
      # - name: Install dependencies
      #   if: steps.mode.outputs.bootstrapped == 'true'
      #   run: pnpm install --frozen-lockfile

      - name: Run Harness Gate (template / pre-scaffold mode)
        if: steps.mode.outputs.bootstrapped != 'true'
        run: make gate-harness

      - name: Run MVP Gate (bootstrapped project mode)
        if: steps.mode.outputs.bootstrapped == 'true'
        run: make gate-mvp

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-artifacts
          path: artifacts/
          if-no-files-found: ignore
